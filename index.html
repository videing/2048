<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2048 · 数字合并</title>
<style>
  :root {
    --bg: #14151c;
    --panel: rgba(255, 255, 255, 0.055);
    --panel-line: rgba(255, 255, 255, 0.09);
    --text: #f3f1ea;
    --muted: #9b968b;
    --accent: #f2b179;
    --board: #2a2723;
    --gap: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(242, 177, 121, 0.14), transparent 60%),
      radial-gradient(800px 600px at 100% 0%, rgba(120, 140, 255, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .app {
    width: min(520px, 100%);
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .top { display: flex; flex-direction: column; flex: none; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }

  h1 {
    margin: 0;
    font-size: clamp(40px, 11vw, 58px);
    line-height: 0.95;
    letter-spacing: -0.045em;
    font-weight: 850;
    background: linear-gradient(160deg, #ffd9b0 10%, #f2b179 45%, #e3935a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .scores {
    display: flex;
    gap: 8px;
    flex: none;
  }

  .score-box {
    min-width: 82px;
    padding: 7px 12px 8px;
    text-align: center;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    transition: transform 0.12s ease, border-color 0.2s ease;
  }

  .score-box span {
    display: block;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .score-box strong {
    display: block;
    margin-top: 1px;
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    font-weight: 750;
  }

  .score-box.bump { transform: scale(1.07); border-color: rgba(242, 177, 121, 0.55); }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 12px 0 8px;
  }

  .hint {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .hint kbd {
    display: inline-block;
    padding: 1px 6px;
    margin: 0 1px;
    font-size: 11px;
    font-family: inherit;
    color: #ded9cd;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--panel-line);
    border-radius: 5px;
  }

  .btns { display: flex; gap: 8px; flex: none; }

  button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    color: #241a10;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 9px 15px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }

  button.ghost {
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-line);
  }

  button.icon-btn {
    padding: 8px 11px;
    font-size: 15px;
    line-height: 1;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-line);
  }

  button:disabled { opacity: 0.35; cursor: default; }
  button:disabled:hover { filter: none; }

  .board-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 0;
  }

  .board {
    position: relative;
    flex: none;
    width: min(100%, 470px);
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    background: var(--board);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.045),
      0 24px 60px -24px rgba(0, 0, 0, 0.85);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
    padding: var(--gap);
  }

  .grid-cell {
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.045);
  }

  .tiles { position: absolute; inset: 0; }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    transition: transform 0.1s ease-in-out;
    will-change: transform;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #776e65;
    background: #eee4da;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.08);
  }

  .tile-inner[data-v="2"]    { background: #eee4da; }
  .tile-inner[data-v="4"]    { background: #ede0c8; }
  .tile-inner[data-v="8"]    { background: #f2b179; color: #fdf8f2; }
  .tile-inner[data-v="16"]   { background: #f59563; color: #fdf8f2; }
  .tile-inner[data-v="32"]   { background: #f67c5f; color: #fdf8f2; }
  .tile-inner[data-v="64"]   { background: #f65e3b; color: #fdf8f2; }
  .tile-inner[data-v="128"]  { background: #edcf72; color: #fdf8f2; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 0 18px rgba(237, 207, 114, 0.32); }
  .tile-inner[data-v="256"]  { background: #edcc61; color: #fdf8f2; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 0 20px rgba(237, 204, 97, 0.36); }
  .tile-inner[data-v="512"]  { background: #edc850; color: #fdf8f2; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 0 22px rgba(237, 200, 80, 0.4); }
  .tile-inner[data-v="1024"] { background: #edc53f; color: #fdf8f2; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 0 24px rgba(237, 197, 63, 0.45); }
  .tile-inner[data-v="2048"] { background: #edc22e; color: #fffdf7; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 0 30px rgba(237, 194, 46, 0.55); }
  .tile-inner[data-v="4096"],
  .tile-inner[data-v="8192"],
  .tile-inner[data-v="16384"] { background: #3c3a35; color: #f5f2ea; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 0 30px rgba(255, 255, 255, 0.18); }

  @keyframes appear {
    from { transform: scale(0.35); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes bump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.16); }
    100% { transform: scale(1); }
  }

  .tile.new .tile-inner { animation: appear 0.17s ease-out; }
  .tile.merged .tile-inner { animation: bump 0.18s ease; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(20, 21, 28, 0.72);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay-card { text-align: center; padding: 20px; }

  .overlay-card h2 {
    margin: 0 0 6px;
    font-size: clamp(28px, 8vw, 36px);
    letter-spacing: -0.02em;
  }

  .overlay-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .overlay-card .btns { justify-content: center; }

  .footer {
    margin: 10px 0 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.28);
  }

  @media (max-width: 480px) {
    .app { padding-left: 12px; padding-right: 12px; }
    header { gap: 10px; }
    h1 { font-size: clamp(34px, 12vw, 46px); }
    .subtitle { font-size: 12px; margin-top: 4px; }
    .score-box { min-width: 64px; padding: 5px 9px 6px; }
    .score-box span { font-size: 10px; letter-spacing: 0.1em; }
    .score-box strong { font-size: 17px; }
    .hint { display: none; }
    .toolbar { justify-content: flex-end; gap: 8px; margin: 8px 0 6px; }
    .btns button { padding: 8px 12px; font-size: 13px; }
    .footer { display: none; }
    .overlay-card { padding: 14px; }
    .overlay-card h2 { font-size: 26px; }
  }

  @media (max-height: 620px) {
    .subtitle, .footer { display: none; }
    .toolbar { margin: 6px 0 4px; }
  }

  /* 手机横屏：左侧信息、右侧棋盘，充分利用横向空间 */
  @media (orientation: landscape) and (max-height: 560px) {
    .app {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
      max-width: 960px;
      height: 100vh;
      height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
    }
    .top { flex: none; width: min(280px, 34vw); }
    h1 { font-size: clamp(30px, 5.2vw, 40px); }
    .subtitle { font-size: 12px; margin-top: 4px; }
    .hint { display: none; }
    .toolbar { margin: 10px 0 0; justify-content: flex-start; }
    .board-wrap { flex: 0 0 auto; width: min(430px, 48vw); height: 100%; align-items: center; justify-content: center; padding: 0; }
    .footer { display: none; }
    .score-box { min-width: 72px; }
  }

  /* 桌面上不需要撑满整屏，保持紧凑的竖向排版 */
  @media (min-width: 481px) and (min-height: 621px) {
    .app { height: auto; min-height: 100vh; min-height: 100dvh; }
    .board-wrap { flex: 0 0 auto; align-items: flex-start; }
  }

  /* 背景装饰层：漂浮的数字方块 */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bg svg { display: block; width: 100%; height: 100%; }

  .bg-num {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: -2px;
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bgGlowA" cx="16%" cy="6%" r="62%">
        <stop offset="0%" stop-color="#f2b179" stop-opacity=".30" />
        <stop offset="55%" stop-color="#f2b179" stop-opacity=".07" />
        <stop offset="100%" stop-color="#f2b179" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="bgGlowB" cx="90%" cy="8%" r="58%">
        <stop offset="0%" stop-color="#7c86ff" stop-opacity=".22" />
        <stop offset="100%" stop-color="#7c86ff" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="bgVignette" cx="50%" cy="44%" r="76%">
        <stop offset="52%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#000000" stop-opacity=".58" />
      </radialGradient>
      <filter id="bgSoft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.4" />
      </filter>
    </defs>

    <rect width="1600" height="1000" fill="#14151c" />
    <rect width="1600" height="1000" fill="url(#bgGlowA)" />
    <rect width="1600" height="1000" fill="url(#bgGlowB)" />

    <g opacity=".14" filter="url(#bgSoft)">
      <g transform="translate(150,120) rotate(-12)">
        <rect x="-76" y="-76" width="152" height="152" rx="24" fill="#f2b179" />
        <text class="bg-num" x="0" y="3" font-size="60" fill="#fff7ee">2</text>
      </g>
      <g transform="translate(1460,120) rotate(9)">
        <rect x="-84" y="-84" width="168" height="168" rx="26" fill="#ede0c8" />
        <text class="bg-num" x="0" y="3" font-size="67" fill="#fff7ee">4</text>
      </g>
      <g transform="translate(250,800) rotate(8)">
        <rect x="-95" y="-95" width="190" height="190" rx="28" fill="#f59563" />
        <text class="bg-num" x="0" y="4" font-size="74" fill="#fff7ee">8</text>
      </g>
      <g transform="translate(1390,770) rotate(-7)">
        <rect x="-80" y="-80" width="160" height="160" rx="24" fill="#f2b179" />
        <text class="bg-num" x="0" y="3" font-size="62" fill="#fff7ee">16</text>
      </g>
      <g transform="translate(830,70) rotate(5)">
        <rect x="-70" y="-70" width="140" height="140" rx="22" fill="#f67c5f" />
        <text class="bg-num" x="0" y="2" font-size="55" fill="#fff7ee">32</text>
      </g>
      <g transform="translate(60,470) rotate(-6)">
        <rect x="-64" y="-64" width="128" height="128" rx="20" fill="#edcf72" />
        <text class="bg-num" x="0" y="2" font-size="50" fill="#fff7ee">64</text>
      </g>
      <g transform="translate(1540,440) rotate(11)">
        <rect x="-75" y="-75" width="150" height="150" rx="23" fill="#edc850" />
        <text class="bg-num" x="0" y="3" font-size="52" fill="#fff7ee">128</text>
      </g>
      <g transform="translate(690,910) rotate(-9)">
        <rect x="-75" y="-75" width="150" height="150" rx="23" fill="#f65e3b" />
        <text class="bg-num" x="0" y="3" font-size="52" fill="#fff7ee">256</text>
      </g>
      <g transform="translate(1200,250) rotate(4)">
        <rect x="-100" y="-100" width="200" height="200" rx="30" fill="#edc22e" />
        <text class="bg-num" x="0" y="4" font-size="62" fill="#fffdf7">2048</text>
      </g>
    </g>

    <rect width="1600" height="1000" fill="url(#bgVignette)" />
  </svg>
</div>

<div class="app">
  <div class="top">
  <header>
    <div>
      <h1>2048</h1>
      <p class="subtitle">合并相同数字，拼出 2048</p>
    </div>
    <div class="scores">
      <div class="score-box" id="score-box">
        <span>分数</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-box">
        <span>最高</span>
        <strong id="best">0</strong>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <p class="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>WASD</kbd> 移动，手机可直接滑动</p>
    <div class="btns">
      <button class="icon-btn" id="sound" aria-pressed="true" title="音效开关">🔊</button>
      <button class="ghost" id="undo" disabled>撤销</button>
      <button id="new-game">新游戏</button>
    </div>
  </div>
  </div>

  <div class="board-wrap">
  <div class="board" id="board">
    <div class="grid" id="grid" aria-hidden="true"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay" role="dialog" aria-live="polite">
      <div class="overlay-card">
        <h2 id="ov-title">游戏结束</h2>
        <p id="ov-text">没有可移动的格子了</p>
        <div class="btns">
          <button class="ghost" id="ov-continue" hidden>继续游戏</button>
          <button id="ov-again">再来一局</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <p class="footer">每次移动都会生成一个新数字 · 分数与音效设置会记在本地</p>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var START_TILES = 2;
  var MOVE_MS = 110;

  var boardEl = document.getElementById('board');
  var gridEl = document.getElementById('grid');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var scoreBoxEl = document.getElementById('score-box');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovTextEl = document.getElementById('ov-text');
  var ovAgainEl = document.getElementById('ov-again');
  var ovContinueEl = document.getElementById('ov-continue');
  var undoBtn = document.getElementById('undo');
  var newBtn = document.getElementById('new-game');
  var soundBtn = document.getElementById('sound');

  /* ---------- 音效：Web Audio 实时合成，零外部文件 ---------- */

  var actx = null;
  var muted = false;
  try { muted = localStorage.getItem('2048-muted') === '1'; } catch (e) {}

  function ensureAudio() {
    if (muted) return null;
    if (!actx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { actx = new Ctx(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') {
      try { actx.resume(); } catch (e) {}
    }
    return actx;
  }

  function beep(freq, dur, opt) {
    opt = opt || {};
    if (muted) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime + (opt.delay || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    var vol = opt.vol == null ? 0.06 : opt.vol;
    osc.type = opt.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opt.to) osc.frequency.exponentialRampToValueAtTime(opt.to, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function buzz(ms) {
    if (muted || !navigator.vibrate) return;
    try { navigator.vibrate(ms); } catch (e) {}
  }

  function sfxMove() {
    beep(190, 0.05, { type: 'triangle', vol: 0.035, to: 150 });
  }

  function sfxMerge(value) {
    var n = Math.log(value > 1 ? value : 2) / Math.LN2;
    var f = 300 + 52 * n;
    beep(f, 0.09, { type: 'sine', vol: 0.07 });
    beep(f * 1.5, 0.13, { type: 'sine', vol: 0.045, delay: 0.05 });
    buzz(8);
  }

  function sfxWin() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++) {
      beep(notes[i], 0.24, { type: 'triangle', vol: 0.06, delay: i * 0.11 });
    }
  }

  function sfxOver() {
    beep(340, 0.3, { type: 'sine', vol: 0.06, to: 170 });
    buzz(30);
  }

  function sfxUndo() {
    beep(260, 0.07, { type: 'square', vol: 0.025 });
  }

  function updateSoundBtn() {
    soundBtn.textContent = muted ? '🔇' : '🔊';
    soundBtn.setAttribute('aria-pressed', muted ? 'false' : 'true');
    soundBtn.title = muted ? '音效已关闭，点击开启' : '音效已开启，点击关闭';
  }

  soundBtn.addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem('2048-muted', muted ? '1' : '0'); } catch (e) {}
    updateSoundBtn();
    if (!muted) beep(680, 0.09, { type: 'sine', vol: 0.05 });
  });

  updateSoundBtn();

  // 浏览器要求先有用户手势才能播放声音，这里首次交互时解锁
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (evt) {
    document.addEventListener(evt, function () { ensureAudio(); }, { once: true, passive: true });
  });

  var grid = [];
  var score = 0;
  var best = 0;
  var history = [];
  var busy = false;
  var over = false;
  var won = false;
  var keepPlaying = false;
  var gap = 12;
  var cell = 90;
  var originX = 0;
  var originY = 0;
  var stepX = 0;
  var stepY = 0;

  /* ---------- layout ---------- */

  function measure() {
    var w = boardEl.clientWidth;
    if (!w) return;
    gap = Math.max(8, Math.round(w * 0.03));
    boardEl.style.setProperty('--gap', gap + 'px');
  }

  // 从真实网格单元格读取位置，保证方块与背景格像素级对齐
  function readLayout() {
    var cells = gridEl.children;
    if (cells.length < 5) return false;
    var b = boardEl.getBoundingClientRect();
    var c0 = cells[0].getBoundingClientRect();
    var c1 = cells[1].getBoundingClientRect();
    var c4 = cells[4].getBoundingClientRect();
    if (!c0.width) return false;
    cell = c0.width;
    stepX = c1.left - c0.left;
    stepY = c4.top - c0.top;
    originX = c0.left - b.left;
    originY = c0.top - b.top;
    return true;
  }

  function posOf(r, c) {
    return { x: originX + c * stepX, y: originY + r * stepY };
  }

  function fontSizeFor(value) {
    if (value >= 10000) return cell * 0.24;
    if (value >= 1000) return cell * 0.29;
    if (value >= 100) return cell * 0.35;
    return cell * 0.44;
  }

  function styleTile(t) {
    var p = posOf(t.r, t.c);
    t.el.style.width = cell + 'px';
    t.el.style.height = cell + 'px';
    t.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    t.inner.style.fontSize = fontSizeFor(t.value) + 'px';
  }

  function relayout() {
    measure();
    readLayout();
    eachTile(function (t) { styleTile(t); });
  }

  /* ---------- tiles ---------- */

  function eachTile(fn) {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c]) fn(grid[r][c]);
      }
    }
  }

  function makeTile(value, r, c, isNew) {
    var el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' new' : '');

    var inner = document.createElement('div');
    inner.className = 'tile-inner';
    inner.dataset.v = String(value);
    inner.textContent = String(value);

    el.appendChild(inner);
    tilesEl.appendChild(el);

    var t = { value: value, r: r, c: c, el: el, inner: inner };
    grid[r][c] = t;
    styleTile(t);
    return t;
  }

  function setValue(t, value) {
    t.value = value;
    t.inner.dataset.v = String(value);
    t.inner.textContent = String(value);
    t.inner.style.fontSize = fontSizeFor(value) + 'px';
  }

  function pop(t) {
    t.el.classList.remove('merged');
    void t.el.offsetWidth;
    t.el.classList.add('merged');
  }

  function removeTile(t) {
    if (t.el.parentNode) t.el.parentNode.removeChild(t.el);
  }

  /* ---------- state ---------- */

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < SIZE; r++) {
      g.push([null, null, null, null]);
    }
    return g;
  }

  function emptyCells() {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) out.push([r, c]);
      }
    }
    return out;
  }

  function addRandomTile() {
    var cells = emptyCells();
    if (!cells.length) return null;
    var pick = cells[Math.floor(Math.random() * cells.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    return makeTile(value, pick[0], pick[1], true);
  }

  function renderScore() {
    scoreEl.textContent = String(score);
    if (score > best) {
      best = score;
      try { localStorage.setItem('best-2048', String(best)); } catch (e) {}
    }
    bestEl.textContent = String(best);
  }

  function bumpScore() {
    scoreBoxEl.classList.add('bump');
    setTimeout(function () { scoreBoxEl.classList.remove('bump'); }, 140);
  }

  function pushHistory() {
    var snapshot = { score: score, cells: [] };
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) {
        row.push(grid[r][c] ? grid[r][c].value : 0);
      }
      snapshot.cells.push(row);
    }
    history.push(snapshot);
    if (history.length > 30) history.shift();
    undoBtn.disabled = false;
  }

  function loadSnapshot(snapshot) {
    tilesEl.innerHTML = '';
    grid = emptyGrid();
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = snapshot.cells[r][c];
        if (v) makeTile(v, r, c, false);
      }
    }
    score = snapshot.score;
    renderScore();
  }

  /* ---------- movement ---------- */

  var VEC = {
    left: { dr: 0, dc: -1 },
    right: { dr: 0, dc: 1 },
    up: { dr: -1, dc: 0 },
    down: { dr: 1, dc: 0 }
  };

  function linesFor(dir) {
    var lines = [];
    var r, c, coords, i;
    if (dir === 'left' || dir === 'right') {
      for (r = 0; r < SIZE; r++) {
        coords = [];
        for (i = 0; i < SIZE; i++) {
          c = dir === 'left' ? i : SIZE - 1 - i;
          coords.push([r, c]);
        }
        lines.push(coords);
      }
    } else {
      for (c = 0; c < SIZE; c++) {
        coords = [];
        for (i = 0; i < SIZE; i++) {
          var rr = dir === 'up' ? i : SIZE - 1 - i;
          coords.push([rr, c]);
        }
        lines.push(coords);
      }
    }
    return lines;
  }

  function move(dir) {
    if (busy || over) return;

    var plans = [];
    var gained = 0;
    var moved = false;

    var lines = linesFor(dir);
    for (var li = 0; li < lines.length; li++) {
      var coords = lines[li];
      var list = [];
      for (var k = 0; k < coords.length; k++) {
        var t = grid[coords[k][0]][coords[k][1]];
        if (t) list.push(t);
      }
      if (!list.length) continue;

      var out = [];
      for (var i = 0; i < list.length; i++) {
        var cur = list[i];
        var last = out[out.length - 1];
        if (last && !last.merged && last.newValue === cur.value) {
          last.newValue *= 2;
          last.merged = true;
          last.extras.push(cur);
        } else {
          out.push({ newValue: cur.value, primary: cur, extras: [], merged: false });
        }
      }
      for (var j = 0; j < out.length; j++) {
        plans.push({ entry: out[j], r: coords[j][0], c: coords[j][1] });
      }
    }

    for (var p = 0; p < plans.length; p++) {
      var plan = plans[p];
      if (plan.entry.primary.r !== plan.r || plan.entry.primary.c !== plan.c) moved = true;
      if (plan.entry.merged) {
        moved = true;
        gained += plan.entry.newValue;
      }
    }
    if (!moved) return;

    pushHistory();
    grid = emptyGrid();

    for (var q = 0; q < plans.length; q++) {
      var e = plans[q];
      e.entry.primary.r = e.r;
      e.entry.primary.c = e.c;
      grid[e.r][e.c] = e.entry.primary;
      for (var x = 0; x < e.entry.extras.length; x++) {
        e.entry.extras[x].r = e.r;
        e.entry.extras[x].c = e.c;
      }
    }

    for (var m = 0; m < plans.length; m++) {
      styleTile(plans[m].entry.primary);
      for (var y = 0; y < plans[m].entry.extras.length; y++) {
        styleTile(plans[m].entry.extras[y]);
      }
    }

    if (!gained) sfxMove();

    busy = true;
    setTimeout(function () {
      var sounds = 0;
      for (var n = 0; n < plans.length; n++) {
        var en = plans[n].entry;
        if (!en.merged) continue;
        for (var z = 0; z < en.extras.length; z++) removeTile(en.extras[z]);
        setValue(en.primary, en.newValue);
        pop(en.primary);
        if (sounds < 2) {
          sfxMerge(en.newValue);
          sounds++;
        }
      }
      if (gained) {
        score += gained;
        renderScore();
        bumpScore();
      }
      addRandomTile();
      busy = false;
      checkState();
    }, MOVE_MS);
  }

  /* ---------- win / lose ---------- */

  function hasMoves() {
    if (emptyCells().length) return true;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c].value;
        if (c + 1 < SIZE && grid[r][c + 1].value === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function highest() {
    var max = 0;
    eachTile(function (t) { if (t.value > max) max = t.value; });
    return max;
  }

  function checkState() {
    if (!won && !keepPlaying && highest() >= 2048) {
      won = true;
      sfxWin();
      showOverlay('2048 达成 🎉', '还能继续挑战更高数字', true);
      return;
    }
    if (!hasMoves()) {
      over = true;
      sfxOver();
      showOverlay('游戏结束', '最终得分 ' + score + ' · 最高数字 ' + highest(), false);
    }
  }

  function showOverlay(title, text, canContinue) {
    ovTitleEl.textContent = title;
    ovTextEl.textContent = text;
    ovContinueEl.hidden = !canContinue;
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  /* ---------- game lifecycle ---------- */

  function newGame() {
    tilesEl.innerHTML = '';
    grid = emptyGrid();
    score = 0;
    history = [];
    busy = false;
    over = false;
    won = false;
    keepPlaying = false;
    undoBtn.disabled = true;
    hideOverlay();
    renderScore();
    for (var i = 0; i < START_TILES; i++) addRandomTile();
  }

  function undo() {
    if (busy || !history.length) return;
    var snapshot = history.pop();
    loadSnapshot(snapshot);
    sfxUndo();
    over = false;
    won = false;
    keepPlaying = false;
    hideOverlay();
    undoBtn.disabled = history.length === 0;
  }

  function keepGoing() {
    keepPlaying = true;
    hideOverlay();
  }

  /* ---------- input ---------- */

  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', a: 'left', s: 'down', d: 'right',
    W: 'up', A: 'left', S: 'down', D: 'right',
    Up: 'up', Down: 'down', Left: 'left', Right: 'right'
  };

  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var dir = KEYMAP[ev.key];
    if (!dir) return;
    ev.preventDefault();
    move(dir);
  }, { passive: false });

  var touchStart = null;
  var SWIPE_MIN = 22;

  boardEl.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    touchStart = { x: ev.clientX, y: ev.clientY, id: ev.pointerId };
  });

  boardEl.addEventListener('pointerup', function (ev) {
    if (!touchStart || touchStart.id !== ev.pointerId) { touchStart = null; return; }
    var dx = ev.clientX - touchStart.x;
    var dy = ev.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  boardEl.addEventListener('pointercancel', function () { touchStart = null; });

  newBtn.addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);
  ovAgainEl.addEventListener('click', newGame);
  ovContinueEl.addEventListener('click', keepGoing);

  /* ---------- boot ---------- */

  function buildGridCells() {
    gridEl.innerHTML = '';
    for (var i = 0; i < SIZE * SIZE; i++) {
      var d = document.createElement('div');
      d.className = 'grid-cell';
      gridEl.appendChild(d);
    }
  }

  try { best = parseInt(localStorage.getItem('best-2048') || '0', 10) || 0; } catch (e) { best = 0; }

  // 按可用空间给棋盘定尺寸：手机竖屏受宽度限制，横屏/矮屏受高度限制
  var lastBoardSize = 0;

  function fitBoard() {
    var wrap = boardEl.parentElement;
    if (!wrap) return false;
    var rect = wrap.getBoundingClientRect();
    var availW = wrap.clientWidth;
    var availH = (window.innerHeight || document.documentElement.clientHeight) - rect.top - 12;
    if (!availW || availH <= 0) return false;
    var size = Math.max(220, Math.min(availW, availH, 470));
    size = Math.round(size * 10) / 10;
    if (Math.abs(size - lastBoardSize) < 0.5) return false;
    lastBoardSize = size;
    boardEl.style.width = size + 'px';
    boardEl.style.height = size + 'px';
    return true;
  }

  buildGridCells();
  fitBoard();
  measure();
  readLayout();
  newGame();
  bestEl.textContent = String(best);

  // 等浏览器完成首次布局后再校准一次（字体加载、移动端地址栏收起都会改变可用高度）
  requestAnimationFrame(function () { fitBoard(); relayout(); });

  var resizeTimer = null;
  function onViewportChange() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { fitBoard(); relayout(); }, 60);
  }

  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  window.addEventListener('load', function () { fitBoard(); relayout(); });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportChange);
  }

  // 布局模式切换（竖屏<->横屏、字体重新排版）时自动重算
  if (window.ResizeObserver) {
    try {
      new ResizeObserver(function () {
        if (fitBoard()) relayout();
      }).observe(boardEl.parentElement);
    } catch (e) {}
  }
})();
</script>
</body>
</html>
